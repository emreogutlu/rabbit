# Use JWT authentication exclusively for AMQP
auth_backends.1 = rabbit_auth_backend_oauth2

# Expected value of the JWT audience claim
auth_oauth2.resource_server_id = emre_rabbitmq_server

# RSA public key used to verify JWT signatures
auth_oauth2.signing_keys.local-key = /etc/rabbitmq/public.pem
auth_oauth2.default_key = local-key

# Only accept RS256 JWT signatures
auth_oauth2.algorithms.1 = RS256

# Bearer token authentication for Management HTTP API
management.disable_basic_auth = true
